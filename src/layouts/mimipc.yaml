id: mimipc
name: 仿PC快捷键布局
author: 寻风
description: |-
  仿PC之快捷，敲码之便捷。
  上滑：A 全选、Z 撤回、B 回车、N 重复上次操作、
  X 剪切、C 复制、V 粘贴。
  中英键盘：空格改居中缩小，左右各加光标控制；
  逗号与句号合并，单击逗号、上滑句号；
  逗号句号放左边，中英切换放右边；
  中英文 QWERPD 上滑符号均为英标符；
  中文状态上下滑 P 出 + -，上滑 D 出 =；
  中英状态上下滑 M 分别出各自中英符 ! ?；
  英文状态适配常用命令符。
  数字键盘：数字面板改为二级页面，绕过并屏蔽二级符号；
  左右 + - * / 外多加 @；空格键居中以适应多数人习惯；
  符号与表情一起放在右边。
tags: [布局, 快捷键,配色]
