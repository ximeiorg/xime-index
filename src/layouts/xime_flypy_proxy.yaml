author: tiengming
description: 专为小鹤双拼优化的键盘布局，支持加速下载扩展商店资源，提供中英文 26 键，下滑显示韵母/声母提示，上滑显示常用中文标点与符号，内置多款精美主题，适配 Xime 3.0。
