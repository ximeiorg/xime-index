id: qq_pinyin
name: QQ拼音版布局
author: YeJing22
description: 一比一复刻 QQ 拼音的中文九宫格、英文与数字键盘，仅改动这三套键盘。九键手势绑定高频动作：1 复制、2 换行、3 剪切、4 全选、5 四向移光标与行首行尾、6 粘贴、7/8/9 send_rime 上屏逗号冒号句号；英文 q-p 上滑数字、a-l 上滑标点、z-m 上滑符号。不含配色与字体，套用后原主题不变。
tags: [布局, 快捷键]
repo: https://github.com/YeJing22/xime-layout-qq-pinyin
license: MIT
appVersion: ">=3.3.0"
requiresSchemes: []
warning: 本布局仅针对九键、英文 26 键与数字键盘设计。因九键的切换语言键与数字键位置做过对调，若你主要使用中文全键盘，切换时可能遇到语言键/数字键位置反复变化，建议先试用再长期使用。
