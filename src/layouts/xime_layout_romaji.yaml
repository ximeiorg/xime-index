id: xime_layout_romaji
name: 日语罗马音键盘
author: 抹露茶柒
description: 标准 QWERTY 26 个字母键 + 1 个长音键（-），献给日语罗马音输入。键面不放假名助记，上滑出数字与日文常用标点。
